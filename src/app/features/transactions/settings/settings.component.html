<div class="settings-container p-6">
  <h1 class="text-3xl font-bold mb-6">Settings</h1>
  
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div *ngFor="let item of settingsMenuItems" 
         class="settings-card p-6 bg-white rounded-lg shadow-md hover:shadow-lg cursor-pointer transition-shadow"
         (click)="navigateTo(item.route)">
      <div class="flex items-start">
        <mat-icon class="text-4xl mr-4 text-primary">{{item.icon}}</mat-icon>
        <div>
          <h2 class="text-xl font-semibold mb-2">{{item.title}}</h2>
          <p class="text-gray-600">{{item.description}}</p>
        </div>
      </div>
    </div>
  </div>
</div>
