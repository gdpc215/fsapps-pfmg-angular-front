<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold">Duplicate Detection Rules</h2>
    <button mat-raised-button color="primary" (click)="openDialog()">
      <mat-icon>edit</mat-icon> Edit Rules
    </button>
  </div>

  <div *ngIf="rules.length === 0" class="text-center py-12 text-gray-500">
    <mat-icon class="text-6xl mb-4">rule</mat-icon>
    <p>No duplicate detection rules configured yet. Click "Edit Rules" to get started.</p>
  </div>

  <div *ngIf="rules.length > 0" class="bg-white rounded-lg shadow overflow-hidden">
    <table mat-table [dataSource]="rules" class="w-full">
      <ng-container matColumnDef="descriptions">
        <th mat-header-cell *matHeaderCellDef class="font-bold">Descriptions</th>
        <td mat-cell *matCellDef="let rule">
          <span class="font-mono">[{{ rule.descriptionGroup.join(' = ') }}]</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="accountType">
        <th mat-header-cell *matHeaderCellDef class="font-bold">Account Type</th>
        <td mat-cell *matCellDef="let rule">{{ rule.accountType }}</td>
      </ng-container>
      <ng-container matColumnDef="currencies">
        <th mat-header-cell *matHeaderCellDef class="font-bold">Currencies</th>
        <td mat-cell *matCellDef="let rule">{{ rule.currencies.join(', ') }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['descriptions', 'accountType', 'currencies']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['descriptions', 'accountType', 'currencies'];"></tr>
    </table>
  </div>
</div>
