<h2 mat-dialog-title>Add Contribution — {{ data.goalName }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-4 mt-2 min-w-[320px]">
    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <input matInput type="date" formControlName="date">
      <mat-error *ngIf="form.get('date')?.hasError('required')">Date is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Amount (PEN)</mat-label>
      <input matInput type="number" formControlName="amount" placeholder="0.00" step="0.01" min="0.01">
      <mat-error *ngIf="form.get('amount')?.hasError('required')">Amount is required</mat-error>
      <mat-error *ngIf="form.get('amount')?.hasError('min')">Must be greater than 0</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="form.invalid">Add</button>
</mat-dialog-actions>
