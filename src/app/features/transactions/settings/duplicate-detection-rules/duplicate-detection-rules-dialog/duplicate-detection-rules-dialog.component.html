<h2 mat-dialog-title>Duplicate Detection Rules</h2>
<form [formGroup]="form">
  <mat-dialog-content>
    <div class="mb-4">
      <label class="block font-semibold mb-1">Equivalencies</label>
      <div formArrayName="equivalencies" class="flex flex-col gap-2 mb-2">
        <div *ngFor="let ctrl of equivalencies.controls; let i = index">
          <mat-form-field appearance="outline" class="w-full">
            <input matInput [formControlName]="i" placeholder="Description">
          </mat-form-field>
          <div class="mt-1">
            <button *ngIf="equivalencies.length > 2" mat-icon-button color="warn" (click)="removeEquivalencyBox(i)"><mat-icon>remove_circle</mat-icon></button>
          </div>
        </div>
        <button mat-stroked-button color="primary" type="button" (click)="addEquivalencyBox()"><mat-icon>add</mat-icon> Add Description</button>
      </div>
    </div>

    <div class="mb-4" formGroupName="accountTypes">
      <label class="block font-semibold mb-1">Account Types</label>
      <div class="flex gap-4">
        <mat-checkbox formControlName="debit">Debit</mat-checkbox>
        <mat-checkbox formControlName="credit">Credit</mat-checkbox>
      </div>
    </div>

    <div class="mb-4">
      <label class="block font-semibold mb-1">Currencies</label>
      <div formArrayName="currencies" class="flex flex-wrap gap-4">
        <ng-container *ngFor="let currency of currencies; let i = index">
          <mat-checkbox [formControlName]="i">{{ currency.symbol }} {{ currency.code }}</mat-checkbox>
        </ng-container>
      </div>
    </div>

    <div class="mt-4">
      <ul>
        <li *ngFor="let rule of rules; let i = index" class="flex items-center gap-2 mb-1">
          <span class="font-mono">[{{ rule.descriptionGroup.join(' = ') }}]</span>
          <span class="text-xs text-gray-500">({{ rule.accountType }}, {{ rule.currencies.join(', ') }})</span>
          <button mat-icon-button color="warn" (click)="removeRule(i)"><mat-icon>delete</mat-icon></button>
        </li>
      </ul>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-raised-button color="primary" type="button" (click)="saveDialog()">Save</button>
  </mat-dialog-actions>
</form>
