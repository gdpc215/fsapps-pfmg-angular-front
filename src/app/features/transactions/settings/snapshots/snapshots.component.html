<div class="p-6">
  <h2 class="text-2xl font-bold mb-4">Snapshots</h2>

  <form [formGroup]="form" class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-6" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
      <mat-label>Source</mat-label>
      <mat-select formControlName="sourceId">
        <mat-option *ngFor="let source of accounts" [value]="source.id">{{ source.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <input matInput type="date" formControlName="datetime" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Balance</mat-label>
      <input matInput type="number" formControlName="balance" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Currency</mat-label>
      <mat-select formControlName="currency">
        <mat-option value="PEN">PEN</mat-option>
        <mat-option value="USD">USD</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="md:col-span-4">
      <button mat-raised-button color="primary" type="submit">Add Snapshot</button>
    </div>
  </form>

  <div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="w-full border-collapse">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-3 text-left text-sm font-bold text-gray-700">Source</th>
          <th class="px-4 py-3 text-left text-sm font-bold text-gray-700">Date</th>
          <th class="px-4 py-3 text-right text-sm font-bold text-gray-700">Balance</th>
          <th class="px-4 py-3 text-left text-sm font-bold text-gray-700">Currency</th>
          <th class="px-4 py-3 text-right text-sm font-bold text-gray-700">Actions</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let snapshot of snapshots">
          <!-- View row -->
          <tr *ngIf="editingSnapshotId !== snapshot.id" class="border-b border-gray-200">
            <td class="px-4 py-3">{{ getSourceName(snapshot.sourceId) }}</td>
            <td class="px-4 py-3">{{ snapshot.datetime | date:'dd/MM/yyyy' }}</td>
            <td class="px-4 py-3 text-right">{{ snapshot.balance | number:'1.2-2' }}</td>
            <td class="px-4 py-3">{{ snapshot.currency }}</td>
            <td class="px-4 py-3 text-right">
              <button mat-icon-button (click)="editSnapshot(snapshot)" matTooltip="Edit">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteSnapshot(snapshot.id)" matTooltip="Delete">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </tr>
          <!-- Edit row -->
          <tr *ngIf="editingSnapshotId === snapshot.id" class="border-b border-blue-200 bg-blue-50">
            <td class="px-4 py-2">{{ getSourceName(snapshot.sourceId) }}</td>
            <td class="px-4 py-2" [formGroup]="editForm">
              <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
                <input matInput type="date" formControlName="datetime">
              </mat-form-field>
            </td>
            <td class="px-4 py-2 text-right" [formGroup]="editForm">
              <mat-form-field appearance="outline" class="w-36" subscriptSizing="dynamic">
                <input matInput type="number" formControlName="balance" step="0.01">
              </mat-form-field>
            </td>
            <td class="px-4 py-2" [formGroup]="editForm">
              <mat-form-field appearance="outline" class="w-24" subscriptSizing="dynamic">
                <mat-select formControlName="currency">
                  <mat-option value="PEN">PEN</mat-option>
                  <mat-option value="USD">USD</mat-option>
                </mat-select>
              </mat-form-field>
            </td>
            <td class="px-4 py-2 text-right">
              <button mat-icon-button color="primary" (click)="saveEdit(snapshot)" matTooltip="Save">
                <mat-icon>check</mat-icon>
              </button>
              <button mat-icon-button (click)="cancelEdit()" matTooltip="Cancel">
                <mat-icon>close</mat-icon>
              </button>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
</div>
