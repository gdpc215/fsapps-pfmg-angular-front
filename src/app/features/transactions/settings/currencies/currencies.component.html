<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold">Currencies</h2>
    <button mat-raised-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon> Add Currency
    </button>
  </div>

  <div *ngIf="(currencies$ | async)?.length === 0" class="text-center py-12 text-gray-500">
    <mat-icon class="text-6xl mb-4">account_balance</mat-icon>
    <p>No currencies configured yet. Click "Add Currency" to get started.</p>
  </div>

  <div *ngIf="(currencies$ | async)?.length! > 0" class="bg-white rounded-lg shadow overflow-hidden">
    <table mat-table [dataSource]="currencies$" class="w-full">
      
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef class="font-bold">Code</th>
        <td mat-cell *matCellDef="let currency">{{ currency.code }}</td>
      </ng-container>

      <ng-container matColumnDef="symbol">
        <th mat-header-cell *matHeaderCellDef class="font-bold">Symbol</th>
        <td mat-cell *matCellDef="let currency">{{ currency.symbol }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef class="font-bold">Name</th>
        <td mat-cell *matCellDef="let currency">{{ currency.name }}</td>
      </ng-container>

      <ng-container matColumnDef="conversionRate">
        <th mat-header-cell *matHeaderCellDef class="font-bold">Rate to PEN</th>
        <td mat-cell *matCellDef="let currency">
          <span *ngIf="currency.code === 'PEN'">-</span>
          <span *ngIf="currency.code !== 'PEN'">
            1 {{ currency.code }} = {{ currency.conversionRate | number:'1.2-4' }} PEN
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="font-bold text-right">Actions</th>
        <td mat-cell *matCellDef="let currency" class="text-right">
          <button mat-icon-button (click)="openEditDialog(currency)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="deleteCurrency(currency)" matTooltip="Delete" color="warn">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
