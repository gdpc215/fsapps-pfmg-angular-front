<h2 mat-dialog-title>{{ data.goal ? 'Edit' : 'New' }} Savings Goal</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-4 mt-2 min-w-[360px]">
    <mat-form-field appearance="outline">
      <mat-label>Goal Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g. Emergency Fund">
      <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Target Amount (PEN)</mat-label>
      <input matInput type="number" formControlName="targetAmount" placeholder="0.00" step="0.01" min="0.01">
      <mat-error *ngIf="form.get('targetAmount')?.hasError('required')">Target amount is required</mat-error>
      <mat-error *ngIf="form.get('targetAmount')?.hasError('min')">Must be greater than 0</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="form.invalid">Save</button>
</mat-dialog-actions>
