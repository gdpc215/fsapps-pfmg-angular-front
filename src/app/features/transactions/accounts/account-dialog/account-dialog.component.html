<h2 mat-dialog-title>{{ data.account ? 'Edit' : 'Add' }} Account</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-4">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Main Checking Account">
      <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Currency</mat-label>
      <mat-select formControlName="currencyId">
        <mat-option *ngFor="let currency of data.currencies" [value]="currency.id">
          {{ currency.symbol }} {{ currency.code }} - {{ currency.name }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('currencyId')?.hasError('required')">Currency is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Current Balance</mat-label>
      <input matInput type="number" formControlName="currentBalance" placeholder="0.00" step="0.01">
      <mat-error *ngIf="form.get('currentBalance')?.hasError('required')">Current balance is required</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="form.invalid">Save</button>
</mat-dialog-actions>
