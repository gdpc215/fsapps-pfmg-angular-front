<div class="p-4">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-semibold">Debit Accounts</h1>
    <button mat-raised-button color="primary" routerLink="/debit-accounts/new">
      <mat-icon>add</mat-icon> Add Debit Account
    </button>
  </div>

  <ng-container *ngIf="accounts$ | async as accounts">
    <div *ngIf="accounts.length === 0" class="text-gray-500 text-center py-12">
      No debit accounts configured yet.
    </div>

    <mat-card *ngFor="let account of accounts" class="mb-3">
      <mat-card-content class="flex items-center justify-between pt-4">
        <div>
          <p class="font-semibold text-lg">{{ account.strName }}</p>
          <ng-container *ngIf="getBalanceInfo(account.id) as info">
            <p class="text-sm mt-1">
              Balance: <app-amount-display [value]="info.balance"></app-amount-display>
              <span *ngIf="info.dateImport" class="text-gray-400 text-xs ml-1">
                (as of {{ info.dateImport | date:'dd/MM/yyyy' }})
              </span>
              <span *ngIf="!info.dateImport" class="text-gray-400 text-xs ml-1">— no import yet</span>
            </p>
          </ng-container>
        </div>
        <div class="flex gap-2">
          <button mat-icon-button matTooltip="Edit" (click)="onEdit(account)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Delete" color="warn" (click)="onDelete(account)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </ng-container>
</div>
