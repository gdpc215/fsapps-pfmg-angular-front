<div class="settings-container p-6">
  <h1 class="text-3xl font-bold mb-8">Settings</h1>

  <div *ngFor="let group of settingsGroups" class="mb-8">
    <h2 class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-3 px-1">
      {{ group.label }}
    </h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div *ngFor="let item of group.items"
           class="settings-card p-5 bg-white rounded-lg shadow hover:shadow-md cursor-pointer transition-shadow flex items-start gap-4"
           (click)="navigateTo(item.route)">
        <mat-icon class="text-3xl flex-shrink-0 mt-0.5"
                  [class.text-red-400]="item.icon === 'delete_forever'"
                  [class.text-primary]="item.icon !== 'delete_forever'">
          {{ item.icon }}
        </mat-icon>
        <div class="min-w-0">
          <h3 class="text-base font-semibold">{{ item.title }}</h3>
          <p class="text-sm text-gray-500 mt-0.5">{{ item.description }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
