<div class="p-4 max-w-md">
  <h1 class="text-2xl font-semibold mb-6">{{ isEdit ? 'Edit Credit Card' : 'New Credit Card' }}</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <mat-form-field appearance="outline">
      <mat-label>Card name</mat-label>
      <input matInput formControlName="strName" placeholder="e.g. Visa BCP">
      <mat-error *ngIf="form.get('strName')?.hasError('required')">Name is required</mat-error>
      <mat-error *ngIf="form.get('strName')?.hasError('maxlength')">Max 100 characters</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Closing day (1–31)</mat-label>
      <input matInput type="number" formControlName="intClosingDay" min="1" max="31">
      <mat-error *ngIf="form.get('intClosingDay')?.hasError('required')">Required</mat-error>
      <mat-error *ngIf="form.get('intClosingDay')?.hasError('min') || form.get('intClosingDay')?.hasError('max')">Must be 1–31</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Payment day (1–31)</mat-label>
      <input matInput type="number" formControlName="intPaymentDay" min="1" max="31">
      <mat-error *ngIf="form.get('intPaymentDay')?.hasError('required')">Required</mat-error>
      <mat-error *ngIf="form.get('intPaymentDay')?.hasError('min') || form.get('intPaymentDay')?.hasError('max')">Must be 1–31</mat-error>
    </mat-form-field>

    <div class="flex gap-3">
      <button mat-raised-button color="primary" type="submit">Save</button>
      <button mat-button type="button" routerLink="/credit-cards">Cancel</button>
    </div>
  </form>
</div>
