<h2 mat-dialog-title>Set Checkpoint for {{ data.entity.name }}</h2>

<mat-dialog-content>
  <p class="mb-4 text-gray-600">
    Enter the current balance to create a checkpoint. This will help track differences between movements and actual balance.
  </p>

  <form [formGroup]="form" class="flex flex-col gap-4">
    <mat-form-field appearance="outline">
      <mat-label>Balance</mat-label>
      <input matInput type="number" formControlName="balance" placeholder="0.00" step="0.01">
      <mat-error *ngIf="form.get('balance')?.hasError('required')">Balance is required</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="form.invalid">Save</button>
</mat-dialog-actions>
