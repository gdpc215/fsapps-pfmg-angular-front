<h2 mat-dialog-title>{{ data.currency ? 'Edit' : 'Add' }} Currency</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-4">
    <mat-form-field appearance="outline"  subscriptSizing="dynamic">
      <mat-label>Code</mat-label>
      <input matInput formControlName="code" placeholder="USD" maxlength="10">
      <mat-error *ngIf="form.get('code')?.hasError('required')">Code is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Symbol</mat-label>
      <input matInput formControlName="symbol" placeholder="$" maxlength="5">
      <mat-error *ngIf="form.get('symbol')?.hasError('required')">Symbol is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="US Dollar">
      <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="form.invalid">Save</button>
</mat-dialog-actions>
