<h2 mat-dialog-title>Balance Snapshots - {{ data.account.name }}</h2>

<mat-dialog-content>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4" [formGroup]="form">
    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <input matInput type="date" formControlName="snapshotDate" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Owed Amount</mat-label>
      <input matInput type="number" formControlName="owedAmount" step="0.01" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Notes</mat-label>
      <input matInput formControlName="notes" />
    </mat-form-field>
  </div>

  <div class="flex gap-2 mb-4">
    <button mat-raised-button color="primary" (click)="onSave()" [disabled]="form.invalid">
      {{ editingSnapshotId ? 'Update Snapshot' : 'Add Snapshot' }}
    </button>
    <button mat-stroked-button (click)="startCreate()">Clear</button>
  </div>

  <div *ngIf="snapshots.length === 0" class="text-sm text-gray-500">
    No snapshots created yet.
  </div>

  <div *ngIf="snapshots.length > 0" class="max-h-[320px] overflow-auto border rounded">
    <table class="w-full border-collapse">
      <thead class="bg-gray-50 sticky top-0">
        <tr>
          <th class="px-3 py-2 text-left text-sm">Date</th>
          <th class="px-3 py-2 text-right text-sm">Owed</th>
          <th class="px-3 py-2 text-left text-sm">Notes</th>
          <th class="px-3 py-2 text-right text-sm">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let snapshot of snapshots" class="border-t">
          <td class="px-3 py-2 text-sm">{{ snapshot.snapshotDate | date:'dd/MM/yyyy' }}</td>
          <td class="px-3 py-2 text-sm text-right">{{ snapshot.owedAmount | number:'1.2-2' }}</td>
          <td class="px-3 py-2 text-sm">{{ snapshot.notes || '-' }}</td>
          <td class="px-3 py-2 text-right">
            <button mat-icon-button (click)="startEdit(snapshot)" matTooltip="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteSnapshot(snapshot)" matTooltip="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onClose()">Close</button>
</mat-dialog-actions>
