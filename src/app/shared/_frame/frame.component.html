<!-- Top bar -->
<div class="fixed top-0 w-full z-10 bg-gray-200 shadow text-sm text-gray-800">
  <div class="flex flex-row h-14 gap-3 w-full px-4 justify-between items-center">
    <h1 class="flex-grow text-base font-medium font-gordita">{{ title }}</h1>
    <div class="flex items-center gap-4">
      <a routerLink="/app/home" class="hover:underline">Home</a>
      <a routerLink="/app/about" class="hover:underline">About</a>
      <a [matMenuTriggerFor]="transactionsMenu" class="hover:underline cursor-pointer">Transactions</a>
      <mat-menu #transactionsMenu="matMenu">
        <button mat-menu-item routerLink="/transactions/dashboard">
          <mat-icon>dashboard</mat-icon> Dashboard
        </button>
        <button mat-menu-item routerLink="/transactions/movements">
          <mat-icon>receipt_long</mat-icon> Movements
        </button>
        <button mat-menu-item routerLink="/transactions/manual-recurrents">
          <mat-icon>event_available</mat-icon> Due Payments
        </button>
        <button mat-menu-item routerLink="/transactions/reconciliation">
          <mat-icon>account_balance</mat-icon> Reconciliation
        </button>
      </mat-menu>
      <a routerLink="/transactions/settings" matTooltip="Settings"
         class="flex items-center hover:text-gray-600 cursor-pointer">
        <mat-icon>settings</mat-icon>
      </a>
    </div>
  </div>
</div>

<!-- Body -->
<div class="flex flex-col flex-grow my-14">
  <router-outlet></router-outlet>
</div>

<!-- Bottom bar -->
<div class="fixed bottom-0 w-full bg-gray-200 text-gray-800 text-center py-3">
  <p>{{ bottomBarName }}</p>
</div>
