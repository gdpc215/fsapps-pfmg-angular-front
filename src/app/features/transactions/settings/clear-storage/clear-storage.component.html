<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold">Clear Storages</h2>
    <button mat-raised-button color="warn" (click)="clearAll()">
      <mat-icon>delete_forever</mat-icon> Clear All
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div *ngFor="let item of storageTags" class="bg-white rounded-lg shadow p-4 flex items-center justify-between">
      <span class="font-semibold">{{ item.label }}</span>
      <button mat-stroked-button color="warn" (click)="clearStorage(item.key)">
        <mat-icon>delete</mat-icon> Clear {{ item.label }}
      </button>
    </div>
  </div>
</div>
